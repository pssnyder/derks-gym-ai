<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derk's Gym AI - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-robot"></i> Derk's Gym AI
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/teams">Teams</a>
                <a class="nav-link" href="/number_eleven">Number Eleven</a>
                <a class="nav-link" href="/battles">Battles</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Team Overview Cards -->
            <div class="col-12 mb-4">
                <h2><i class="fas fa-users"></i> Derkling Teams</h2>
                <div class="row" id="team-cards">
                    <!-- Team cards will be populated by JavaScript -->
                </div>
            </div>

            <!-- Individual Derklings -->
            <div class="col-12 mb-4">
                <h2><i class="fas fa-user-friends"></i> Derkling Profiles</h2>
                <div class="row" id="derkling-cards">
                    <!-- Derkling cards will be populated by JavaScript -->
                </div>
            </div>

            <!-- Quick Stats -->
            <div class="col-12">
                <h2><i class="fas fa-chart-bar"></i> Quick Stats</h2>
                <div class="row">
                    <div class="col-md-3">
                        <div class="card bg-primary text-white">
                            <div class="card-body">
                                <h5 class="card-title">Total Derklings</h5>
                                <p class="card-text display-4" id="total-derklings">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-success text-white">
                            <div class="card-body">
                                <h5 class="card-title">Active Teams</h5>
                                <p class="card-text display-4" id="active-teams">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-warning text-white">
                            <div class="card-body">
                                <h5 class="card-title">Battles Completed</h5>
                                <p class="card-text display-4" id="battles-completed">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-info text-white">
                            <div class="card-body">
                                <h5 class="card-title">Win Rate</h5>
                                <p class="card-text display-4" id="win-rate">0%</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
