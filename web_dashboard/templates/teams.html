<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Overview - Derk's Gym AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-robot"></i> Derk's Gym AI
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link active" href="/teams">Teams</a>
                <a class="nav-link" href="/number_eleven">Number Eleven</a>
                <a class="nav-link" href="/battles">Battles</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1><i class="fas fa-users"></i> Team Overview & Relationships</h1>
        
        <!-- Team Composition Section -->
        <div class="row mb-5">
            <div class="col-12">
                <h2>Team Compositions</h2>
                <div id="team-compositions">
                    <!-- Team composition cards will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Team Relationships Section -->
        <div class="row mb-5">
            <div class="col-12">
                <h2>Fighter Bonds & Compatibility</h2>
                <div id="team-relationships">
                    <!-- Relationship visualization will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Strategy Loadouts Section -->
        <div class="row">
            <div class="col-12">
                <h2>Strategy Loadouts</h2>
                <div id="strategy-loadouts">
                    <!-- Strategy cards will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/teams.js') }}"></script>
</body>
</html>
